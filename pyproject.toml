[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-agent-evals"
version = "0.1.0"
description = "Regression tests that catch a policy assistant citing a retired rule."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
evals = "policy_evals.cli:main"

[tool.setuptools.packages.find]
include = ["policy_evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
