name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q

  policy-evals:
    # The eval suite on the live policies and cases. It fails when the agent
    # cites a clause that is not in force on the travel date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Replay recorded agent replies (no agent needed)
        id: replay
        run: evals replay
      - name: Run the reference agent live and record its replies
        id: live
        if: always()
        run: evals run --transcripts reports/live-transcript.json
      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eval-reports
          path: reports/
