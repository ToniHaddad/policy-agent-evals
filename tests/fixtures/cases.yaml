# Hand-labelled cases for the warehouse procedures assistant (synthetic).
#
# Each case: the context the assistant gets (project, warehouse, the date of
# the stock movement, language), a warehouse keeper's question, and the
# expected decision. "document", "clause" and "version" are what a correct
# answer must cite. ask_clarification cases cite nothing. escalate means
# "send it to the operations manager".
#
# The FA-2026 annex changed on 2026-10-15: FA-4.1 (report stock within 30
# days of expiry) was retired and replaced by FA-4.2 (45 days).
# These labels were written before the reference agent was run on them.

