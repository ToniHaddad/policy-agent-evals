# Cases the reference agent fails today, with the reason found.
#
# CI gates on regressions: a case listed here may fail without failing the
# build, and every report still shows it as a failure. A listed case that
# starts passing DOES fail the build ("unexpected pass"), so this list
# cannot quietly go stale. Fix the agent, then delete the entry.

- id: lang-ceiling-ar
  reason: >-
    The policy is English only and retrieval is lexical (BM25). No Arabic
    word matches any clause, so the agent asks the user to rephrase.

- id: lang-approver-ar
  reason: >-
    Same cause as lang-ceiling-ar: no Arabic token overlaps the English
    clauses, so the best BM25 score is 0 and the agent asks to rephrase.

- id: lang-late-fr
  reason: >-
    The day-count pattern only knows the English word "days", so "4 jours"
    is not read as a deadline. BM25 then matches the bare digit "4" to
    "sections 3 or 4" in LB-6.1 and answers with the exceptions clause
    instead of escalating.

- id: lang-late-ar
  reason: >-
    Same as lang-late-fr: the Arabic digit is folded to "4", which matches
    "sections 3 or 4" in LB-6.1. The agent answers instead of escalating.

- id: paraphrase-a-week-lb
  reason: >-
    "In a week" is not a day count the agent reads, so it asks how many
    days are left instead of seeing that 7 days is under Lebanon's 10.

- id: paraphrase-no-currency-ke
  reason: >-
    "130 a night" has no currency, so no rate is read. BM25 then ranks the
    advance-booking clause first because of the word "book".
