# Hand-labelled cases for the Northbridge Relief travel assistant (synthetic).
#
# Each case: the context the assistant gets (office, travel date, language),
# the question, and the expected decision. "clause" and "version" are what a
# correct answer must cite. ask_clarification cases cite nothing.
#
# Lebanon's policy changed on 2026-10-15: LB-3.1 (7 days notice) was retired
# and replaced by LB-3.2 (10 days notice). Kenya has one version.

# --- Same question, different right answer in each office -----------------

- id: office-hotel-ceiling-lb
  office: lebanon
  travel_date: 2026-11-25
  language: en
  question: What is the maximum hotel rate per night I can book?
  expect: {action: answer, clause: LB-4.1, version: "2.0"}
  tags: [office-difference]

- id: office-hotel-ceiling-ke
  office: kenya
  travel_date: 2026-11-25
  language: en
  question: What is the maximum hotel rate per night I can book?
  expect: {action: answer, clause: KE-4.1, version: "1.0"}
  tags: [office-difference]

